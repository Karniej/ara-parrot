<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>parrot · push-to-talk dictation for macOS</title>
<meta name="description" content="On-device push-to-talk dictation for macOS. Hold Fn, speak, release.">
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --muted: #737373;
    --muted-strong: #404040;
    --border: #f0f0f0;
    --pill-bg: rgba(0, 0, 0, 0.05);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text",
      "Inter", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1024px;
    margin: 0 auto;
    padding: 20px 24px;
  }
  nav .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    color: var(--text);
    text-decoration: none;
    font-size: 16px;
  }
  nav .brand svg { width: 22px; height: 22px; }
  nav .links { display: flex; gap: 24px; align-items: center; }
  nav .links a {
    color: var(--muted-strong);
    text-decoration: none;
    font-size: 14px;
  }
  nav .links a:hover { color: var(--text); }

  main {
    max-width: 768px;
    margin: 0 auto;
    padding: 80px 24px 160px;
  }
  @media (min-width: 768px) {
    main { padding-top: 112px; }
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .mark {
    width: 96px;
    height: 96px;
    margin-bottom: 24px;
    color: #111;
  }

  .eyebrow {
    font-size: 16px;
    color: var(--muted);
    margin: 0 0 48px;
  }

  h1 {
    font-size: 30px;
    line-height: 1.15;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin: 0 0 24px;
  }
  @media (min-width: 768px) {
    h1 { font-size: 40px; }
  }

  .install {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 8px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 14px;
    color: var(--text);
    margin: 0;
    overflow: hidden;
  }
  .pill code {
    padding: 12px 4px 12px 16px;
    white-space: nowrap;
    font-family: inherit;
  }
  .pill button {
    background: none;
    border: 0;
    padding: 4px 10px;
    cursor: pointer;
    color: var(--muted);
    transition: color 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .pill button:hover { color: var(--text); }
  .pill button svg { width: 16px; height: 16px; }
  .pill button .check { display: none; }
  .pill button.copied .copy { display: none; }
  .pill button.copied .check { display: inline; }

  .install .caption {
    font-size: 14px;
    color: var(--muted);
    margin: 12px 0 0;
  }
  .install .caption a {
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .install .caption a:hover { color: var(--muted-strong); }

  .cta-mobile {
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: #262626;
    color: #ffffff;
    padding: 10px 24px;
    margin-top: 20px;
    font-size: 18px;
    text-decoration: none;
  }
  .cta-mobile:hover { background: #000000; }
  @media (max-width: 480px) {
    .pill, .install .caption { display: none; }
    .cta-mobile { display: inline-flex; }
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="/parrot/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 7h.01"/>
      <path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"/>
      <path d="m20 7 2 .5-2 .5"/>
      <path d="M10 18v3"/>
      <path d="M14 17.75V21"/>
      <path d="M7 18a6 6 0 0 0 3.84-10.61"/>
    </svg>
    <span>parrot</span>
  </a>
  <div class="links">
    <a href="https://github.com/digimata/parrot">GitHub</a>
    <a href="https://github.com/digimata/parrot#readme">Docs</a>
  </div>
</nav>

<main>
  <section class="hero">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 7h.01"/>
      <path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"/>
      <path d="m20 7 2 .5-2 .5"/>
      <path d="M10 18v3"/>
      <path d="M14 17.75V21"/>
      <path d="M7 18a6 6 0 0 0 3.84-10.61"/>
    </svg>

    <p class="eyebrow">Push-to-talk dictation for macOS</p>

    <h1>Hold a key. Speak.<br>Text appears.</h1>

    <div class="install">
      <pre class="pill"><code id="install-cmd">curl -fsSL https://digimata.github.io/parrot/install.sh | sh</code><button type="button" aria-label="Copy install command" onclick="copyInstall(this)">
        <svg class="copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16.5 8.25V6a2.25 2.25 0 00-2.25-2.25H6A2.25 2.25 0 003.75 6v8.25A2.25 2.25 0 006 16.5h2.25m8.25-8.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-7.5A2.25 2.25 0 018.25 18v-1.5m8.25-8.25h-6a2.25 2.25 0 00-2.25 2.25v6"/>
        </svg>
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 12.75l6 6 9-13.5"/>
        </svg>
      </button></pre>
      <p class="caption">paste this in terminal, or <a href="https://github.com/digimata/parrot/releases">download from GitHub</a></p>
    </div>

    <a class="cta-mobile" href="https://github.com/digimata/parrot/releases">Download →</a>
  </section>
</main>

<script>
  function copyInstall(button) {
    const text = document.getElementById('install-cmd').textContent;
    navigator.clipboard.writeText(text).then(() => {
      button.classList.add('copied');
      setTimeout(() => button.classList.remove('copied'), 1500);
    });
  }
</script>

</body>
</html>
