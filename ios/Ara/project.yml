name: Ara
options:
  bundleIdPrefix: com.silpho
  deploymentTarget:
    iOS: "17.0"
settings:
  DEVELOPMENT_TEAM: 547LS36PQ8
  SWIFT_VERSION: "6.0"
  CODE_SIGN_STYLE: Automatic
  MARKETING_VERSION: 0.1.0
  CURRENT_PROJECT_VERSION: 1
schemes:
  Ara:
    build:
      targets:
        Ara: all
    run:
      config: Debug
      storeKitConfiguration: App/Products.storekit
targets:
  Ara:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../../Sources/AraEngine
        group: AraEngine
    info:
      path: App/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        CFBundleDisplayName: Ara
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Ara records only while you dictate, and only on this device. Audio never leaves your phone.
        NSSpeechRecognitionUsageDescription: Ara transcribes your dictation entirely on-device. Nothing is sent anywhere.
        ITSAppUsesNonExemptEncryption: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.silpho.ara
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Entitlements/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.silpho.ara
    dependencies:
      - target: AraKeyboard
        embed: true
  AraKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      - path: ../../Sources/AraEngine
        group: AraEngine
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Ara
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.silpho.ara.keyboard
    entitlements:
      path: Entitlements/Keyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.silpho.ara
